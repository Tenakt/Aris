import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	id "org.jetbrains.kotlin.jvm" version "2.4.10"
}

repositories {
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"aris" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// =========================================================
	// Minecraft
	// =========================================================

	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"


	// Fabric
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"


	// TerraBlender
	include modImplementation(
			"maven.modrinth:kkmrDlKT:chxo508B"
	)

	// Knot
	include modImplementation(
			"maven.modrinth:V9WxBDCZ:HDQnE7Vc"
	)

	// UI Lib
	include modImplementation(
			"maven.modrinth:AOEDs9Al:5cv4tLxe"
	)

	// Arc Lib
	include modImplementation(
			"maven.modrinth:H3eKhxi7:4xFAUSvG"
	)

	// YAML Config
	 include modImplementation(
	     "maven.modrinth:L1FFB418:jvDLVxWH"
	 )


	// Architectury API
	include modImplementation(
			"maven.modrinth:lhGA9TYQ:uNdfrcQ8"
	)

	// Item Restrictions
	include modImplementation(
			"maven.modrinth:rU60qFq2:466hf0Pj"
	)

	// Night Config
	implementation "com.electronwill.night-config:core:3.6.4"
	include "com.electronwill.night-config:core:3.6.4"

	implementation "com.electronwill.night-config:toml:3.6.4"
	include "com.electronwill.night-config:toml:3.6.4"
}

processResources {
	def version = project.version

	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

kotlin {
	compilerOptions {
		jvmTarget = JvmTarget.JVM_21
	}
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name

	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
		// Репозиторий публикации можно добавить позже.
	}
}