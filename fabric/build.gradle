plugins {
    id "fabric-loom" version "1.17-SNAPSHOT"
}

base {
    archivesName = "${project.mod_id}-fabric"
}

dependencies {

    minecraft "com.mojang:minecraft:${minecraft_version}"

    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"

    modImplementation(
            "net.fabricmc:fabric-loader:${fabric_loader_version}"
    )

    modImplementation(
            "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    )

    modImplementation(
            "net.fabricmc:fabric-language-kotlin:${fabric_kotlin_version}"
    )

    modImplementation(
            "com.daqem.knot:knot-fabric:${knot_version}"
    )

    // TerraBlender
    modImplementation(
            "maven.modrinth:kkmrDlKT:chxo508B"
    )

    // NightConfig
    modImplementation(
            "com.electronwill.night-config:core:3.8.1"
    )

    modImplementation(
            "com.electronwill.night-config:toml:3.8.1"
    )

    // Common
    implementation project(
            path: ":common",
            configuration: "namedElements"
    )
}

loom {
    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
            sourceSet("main", ":common")
        }
    }

    runs {
        client {
            client()
            name = "Fabric Client"
        }

        server {
            server()
            name = "Fabric Server"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

// =========================================================
// Fabric mod metadata
// =========================================================

tasks.processResources {
    inputs.properties(
            "version": project.version,
            "minecraft_version": project.minecraft_version,
            "fabric_loader_version": project.fabric_loader_version
    )

    filesMatching("fabric.mod.json") {
        expand(
                "version": project.version,
                "minecraft_version": project.minecraft_version,
                "fabric_loader_version": project.fabric_loader_version
        )
    }
}