plugins {
    id "fabric-loom" version "1.17-SNAPSHOT"
}

base {
    archivesName = "${project.mod_id}-fabric"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"

    // =====================================================
    // Fabric
    // =====================================================

    modImplementation(
            "net.fabricmc:fabric-loader:${fabric_loader_version}"
    )

    modImplementation(
            "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    )

    modImplementation(
            "net.fabricmc:fabric-language-kotlin:${fabric_kotlin_version}"
    )

    // =====================================================
    // Architectury API 19.0.1
    // Minecraft 1.21.11 / Fabric
    // =====================================================

    modImplementation(
            "maven.modrinth:lhGA9TYQ:uNdfrcQ8"
    )

    // =====================================================
    // DAQEM
    // =====================================================

    // UI Lib 19.1.0
    // Fabric 1.21.11
    modImplementation(
            "curse.maven:ui-933200:7650065"
    )

    // YAML Config 19.1.2
    // Fabric 1.21.11
    modImplementation(
            "curse.maven:yaml-config-1128669:8188613"
    )

    // Arc Lib 19.1.1
    // Fabric 1.21.11
    modImplementation(
            "curse.maven:arc-883593:7654922"
    )

    // Item Restrictions 19.1.0
    // Fabric 1.21.11
    modImplementation(
            "curse.maven:item-restrictions-887774:7650342"
    )

    // =====================================================
    // TerraBlender
    // =====================================================

    modImplementation(
            "maven.modrinth:kkmrDlKT:${terrablender_fabric_id}"
    )

    // Moog's Structure Lib
    modImplementation(
            "maven.modrinth:1oUDhxuy:2idiRwR3"
    )

    // =====================================================
    // NightConfig
    // =====================================================

    modImplementation(
            "com.electronwill.night-config:core:3.8.1"
    )

    modImplementation(
            "com.electronwill.night-config:toml:3.8.1"
    )

    // =====================================================
    // Common
    // =====================================================

    implementation project(
            path: ":common",
            configuration: "namedElements"
    )
}

loom {
    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
            sourceSet("main", ":common")
        }
    }

    runs {
        client {
            client()
            name = "Fabric Client"
        }

        server {
            server()
            name = "Fabric Server"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

tasks.processResources {
    inputs.properties(
            "version": project.version,
            "minecraft_version": project.minecraft_version,
            "fabric_loader_version": project.fabric_loader_version
    )

    filesMatching("fabric.mod.json") {
        expand(
                "version": project.version,
                "minecraft_version": project.minecraft_version,
                "fabric_loader_version": project.fabric_loader_version
        )
    }
}