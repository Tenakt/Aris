jar {
    dependsOn(":common:classes")

    from(project(":common").sourceSets.main.output)
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

kotlin {
    jvmToolchain(25)
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", minecraft_version
    inputs.property "fabric_loader_version", fabric_loader_version
    inputs.property "fabric_api_version", fabric_api_version
    inputs.property "fabric_kotlin_version", fabric_kotlin_version

    filesMatching("fabric.mod.json") {
        expand(
                "version": project.version,
                "minecraft_version": minecraft_version,
                "fabric_loader_version": fabric_loader_version,
                "fabric_api_version": fabric_api_version,
                "fabric_kotlin_version": fabric_kotlin_version
        )
    }
}