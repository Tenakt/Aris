plugins {
    id "net.neoforged.moddev" version "2.0.107"
}

base {
    archivesName = "${project.mod_id}-neoforge"
}

dependencies {
    implementation project(":common")
}

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
            gameDirectory = project.file(
                    "runs/client"
            )

            systemProperty(
                    "neoforge.enabledGameTestNamespaces",
                    mod_id
            )
        }

        server {
            server()
            gameDirectory = project.file(
                    "runs/server"
            )

            systemProperty(
                    "neoforge.enabledGameTestNamespaces",
                    mod_id
            )
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}