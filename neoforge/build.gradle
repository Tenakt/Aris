plugins {
    id "net.neoforged.moddev" version "2.0.107"
}

evaluationDependsOn(":common")

base {
    archivesName = "${project.mod_id}-neoforge"
}

neoForge {
    version = neoforge_version

    runs {
        client {
            client()

            gameDirectory = project.file("runs/client")

            systemProperty(
                    "neoforge.enabledGameTestNamespaces",
                    mod_id
            )
        }

        server {
            server()

            gameDirectory = project.file("runs/server")

            systemProperty(
                    "neoforge.enabledGameTestNamespaces",
                    mod_id
            )
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
            sourceSet project(":common").sourceSets.main
        }
    }
}

dependencies {
    implementation project(":common")

    implementation(
            "maven.modrinth:kkmrDlKT:${terrablender_neoforge_id}"
    )

    implementation(
            "com.daqem.knot:knot-neoforge:${knot_version}"
    )

    implementation(
            "maven.modrinth:ordsPcFz:WSKgpZoB"
    )
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

tasks.processResources {
    inputs.properties(
            "version": project.version,
            "mod_id": project.mod_id,
            "mod_version": project.mod_version,
            "minecraft_version": project.minecraft_version
    )

    filesMatching("META-INF/neoforge.mods.toml") {
        expand(
                "version": project.version,
                "mod_id": project.mod_id,
                "mod_version": project.mod_version,
                "minecraft_version": project.minecraft_version
        )
    }
}