plugins {
    id "net.neoforged.moddev" version "2.0.107"
}

evaluationDependsOn(":common")

base {
    archivesName = "${project.mod_id}-neoforge"
}

neoForge {
    version = neoforge_version

    runs {
        client {
            client()

            gameDirectory = project.file("runs/client")

            systemProperty(
                    "neoforge.enabledGameTestNamespaces",
                    mod_id
            )
        }

        server {
            server()

            gameDirectory = project.file("runs/server")

            systemProperty(
                    "neoforge.enabledGameTestNamespaces",
                    mod_id
            )
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
            sourceSet project(":common").sourceSets.main
        }
    }
}

dependencies {
    implementation project(":common")

    // Architectury API
    implementation(
            "dev.architectury:architectury-neoforge:${architectury_version}"
    )

    // Kotlin for Forge
    implementation(
            "maven.modrinth:ordsPcFz:${neoforge_kotlin_version}"
    )

    // UI Lib
    implementation(
            "curse.maven:ui-933200:7650066"
    )

    // YAML Config
    implementation(
            "curse.maven:yaml-config-1128669:8188614"
    )

    // Arc Lib
    implementation(
            "curse.maven:arc-883593:7654923"
    )

    // Item Restrictions
    implementation(
            "curse.maven:item-restrictions-887774:7650343"
    )

    // TerraBlender
    implementation(
            "maven.modrinth:kkmrDlKT:${terrablender_neoforge_id}"
    )

    // Lithostitched
    implementation(
            "maven.modrinth:XaDC71GB:GXKf1eIb"
    )

    // Moog's Structure Lib
    implementation(
            "maven.modrinth:1oUDhxuy:5MelBDO6"
    )

    // Geckolib
    implementation(
            "maven.modrinth:8BmcQJ2H:FpONDAt3"
    )

    // JEI compile only
    compileOnly(
            "mezz.jei:jei-${minecraft_version}-neoforge-api:latest.release"
    )

    // JEI runtime
    runtimeOnly(
            "mezz.jei:jei-${minecraft_version}-neoforge:latest.release"
    )

    // Better Combat
    implementation(
            "maven.modrinth:5sy6g3kz:lkzLyXbV"
    )

    // Player Animation Library
    implementation(
            "curse.maven:player-animation-library-1283899:8507833"
    )

    // Cloth Config API
    implementation(
            "maven.modrinth:9s6osm5g:Wsus0EWg"
    )
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

jar {
    dependsOn(":common:classes")
    from(project(":common").sourceSets.main.output)
}

tasks.processResources {
    inputs.properties(
            "version": project.version,
            "mod_id": project.mod_id,
            "mod_version": project.mod_version,
            "minecraft_version": project.minecraft_version
    )

    filesMatching("META-INF/neoforge.mods.toml") {
        expand(
                "version": project.version,
                "mod_id": project.mod_id,
                "mod_version": project.mod_version,
                "minecraft_version": project.minecraft_version
        )
    }
}