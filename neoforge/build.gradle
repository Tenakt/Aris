plugins {
    id "net.neoforged.moddev" version "2.0.107"
}

evaluationDependsOn(":common")

base {
    archivesName = "${project.mod_id}-neoforge"
}

neoForge {
    version = neoforge_version

    runs {
        client {
            client()

            gameDirectory = project.file("runs/client")

            systemProperty(
                    "neoforge.enabledGameTestNamespaces",
                    mod_id
            )
        }

        server {
            server()

            gameDirectory = project.file("runs/server")

            systemProperty(
                    "neoforge.enabledGameTestNamespaces",
                    mod_id
            )
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
            sourceSet project(":common").sourceSets.main
        }
    }
}

dependencies {
    implementation project(":common")

    // =====================================================
    // Architectury API 19.0.1
    // Minecraft 1.21.11 / NeoForge
    // =====================================================

    implementation(
            "maven.modrinth:lhGA9TYQ:EvL9NK2R"
    )

    // =====================================================
    // DAQEM
    // =====================================================

    // UI Lib 19.1.0
    // NeoForge 1.21.11
    implementation(
            "curse.maven:ui-933200:7650066"
    )

    // YAML Config 19.1.2
    // NeoForge 1.21.11
    implementation(
            "curse.maven:yaml-config-1128669:8188614"
    )

    // Arc Lib 19.1.1
    // NeoForge 1.21.11
    implementation(
            "curse.maven:arc-883593:7654923"
    )

    // Item Restrictions 19.1.0
    // NeoForge 1.21.11
    implementation(
            "curse.maven:item-restrictions-887774:7650343"
    )

    // =====================================================
    // TerraBlender
    // =====================================================

    implementation(
            "maven.modrinth:kkmrDlKT:${terrablender_neoforge_id}"
    )

    // =====================================================
    // Formations 1.0.4
    // NeoForge 1.21.11
    // =====================================================

    implementation(
            "maven.modrinth:tPe4xnPd:j3V7Jnsb"
    )

    // SuperMartijn642's Core Lib
    implementation(
            "maven.modrinth:rOUBggPv:y9DXgWrM"
    )

    // Existing dependency from your project
    implementation(
            "maven.modrinth:ordsPcFz:WSKgpZoB"
    )
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

tasks.processResources {
    inputs.properties(
            "version": project.version,
            "mod_id": project.mod_id,
            "mod_version": project.mod_version,
            "minecraft_version": project.minecraft_version
    )

    filesMatching("META-INF/neoforge.mods.toml") {
        expand(
                "version": project.version,
                "mod_id": project.mod_id,
                "mod_version": project.mod_version,
                "minecraft_version": project.minecraft_version
        )
    }
}