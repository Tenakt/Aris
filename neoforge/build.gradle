plugins {
    id "net.neoforged.moddev" version "2.0.107"
}

evaluationDependsOn(":common")

base {
    archivesName = "${project.mod_id}-neoforge"
}

neoForge {
    version = neoforge_version

    runs {
        client {
            client()

            gameDirectory = project.file("runs/client")

            systemProperty(
                    "neoforge.enabledGameTestNamespaces",
                    mod_id
            )
        }

        server {
            server()

            gameDirectory = project.file("runs/server")

            systemProperty(
                    "neoforge.enabledGameTestNamespaces",
                    mod_id
            )
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
            sourceSet project(":common").sourceSets.main
        }
    }
}

dependencies {
    implementation project(":common")

    // Architectury API 19.0.1
    implementation(
            "maven.modrinth:lhGA9TYQ:EvL9NK2R"
    )

    // UI Lib
    implementation(
            "curse.maven:ui-933200:7650066"
    )

    // YAML Config
    implementation(
            "curse.maven:yaml-config-1128669:8188614"
    )

    // Arc Lib
    implementation(
            "curse.maven:arc-883593:7654923"
    )

    // Item Restrictions
    implementation(
            "curse.maven:item-restrictions-887774:7650343"
    )

    // TerraBlender
    implementation(
            "maven.modrinth:kkmrDlKT:${terrablender_neoforge_id}"
    )

    // Lithostitched
    implementation(
            "maven.modrinth:XaDC71GB:GXKf1eIb"
    )

    // Moog's Structure Lib
    implementation(
            "maven.modrinth:1oUDhxuy:5MelBDO6"
    )

    // Geckolib
    implementation(
            "maven.modrinth:8BmcQJ2H:FpONDAt3"
    )

    // YetAnotherConfigLib (YACL)
    implementation(
            "maven.modrinth:1eAoo2KR:HZs9mrWM"
    )

    // Existing dependency from your project
    implementation(
            "maven.modrinth:ordsPcFz:WSKgpZoB"
    )
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

tasks.processResources {
    inputs.properties(
            "version": project.version,
            "mod_id": project.mod_id,
            "mod_version": project.mod_version,
            "minecraft_version": project.minecraft_version
    )

    filesMatching("META-INF/neoforge.mods.toml") {
        expand(
                "version": project.version,
                "mod_id": project.mod_id,
                "mod_version": project.mod_version,
                "minecraft_version": project.minecraft_version
        )
    }
}